---
apiVersion: 1
datasources:
  - name: Prometheus
    uid: localprometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s

  - name: Grafana Cloud Prometheus
    uid: grafanacloudprom
    type: prometheus
    access: proxy
    url: REPLACE_WITH_GC_METRICS_URL
    basicAuth: true
    basicAuthUser: REPLACE_WITH_GC_METRICS_USERNAME
    jsonData:
      timeInterval: 60s
    secureJsonData:
      basicAuthPassword: REPLACE_WITH_GC_METRICS_PASSWORD

  - name: Loki
    uid: localloki
    type: loki
    access: proxy
    url: http://loki:3100

  - name: PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    user: ironwall
    jsonData:
      sslmode: disable
      database: ironwall
    secureJsonData:
      password: ironwall

  - name: Google Sheets
    type: grafana-googlesheets-datasource
    access: proxy
    basicAuth: false
    isDefault: false
    jsonData:
      authenticationType: jwt
      clientEmail: REPLACE_WITH_GCP_CLIENT_EMAIL
      defaultProject: REPLACE_WITH_GCP_PROJECT
      pdcInjected: false
      tokenUri: https://oauth2.googleapis.com/token
    secureJsonData:
      privateKey: REPLACE_WITH_GCP_SERVICE_ACCOUNT_TOKEN

  - name: MongoDB
    uid: mongodb
    type: haohanyang-mongodb-datasource
    url: ""
    access: proxy
    default: false
    readOnly: false
    basicAuth: false
    withCredentials: false
    jsonData:
      connectionStringScheme: REPLACE_WITH_MONGODB_SCHEME
      host: REPLACE_WITH_MONGODB_HOST
      authType: username-password
      username: REPLACE_WITH_MONGODB_USERNAME
      database: marathon-game-data
      pdcInjected: false
      tlsOption: enabled
    secureJsonData:
      password: REPLACE_WITH_MONGODB_PASSWORD
